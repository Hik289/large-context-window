[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ultra-large-memory-context-window-bench"
version = "0.1.0"
description = "ULMCW-Bench: an ultra-large memory context window benchmark and dual-view memory retrieval artifact."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "The Authors" }]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
